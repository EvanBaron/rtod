[workspace]
resolver = "3"
members = [
    ".",
    "crates/rtod-api",
    "crates/rtod-capture",
    "crates/rtod-model",
    "crates/rtod-track",
    "crates/rtod-geometry",
    "crates/rtod-viewer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rtod-api = { path = "crates/rtod-api" }
rtod-capture = { path = "crates/rtod-capture" }
rtod-model = { path = "crates/rtod-model" }
rtod-track = { path = "crates/rtod-track" }
rtod-geometry = { path = "crates/rtod-geometry" }
rtod-viewer = { path = "crates/rtod-viewer" }

burn = "0.22.0"
minifb = "0.29.0"
nokhwa = "0.10.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[package]
name = "rtod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
rtod-api.workspace = true
rtod-capture.workspace = true
rtod-model.workspace = true
rtod-track.workspace = true
rtod-geometry.workspace = true
rtod-viewer.workspace = true
